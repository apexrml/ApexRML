<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ApexRML — Car Parts Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --charcoal:#1B1E20;
    --panel:#242A2D;
    --paper:#EEE7D8;
    --paper-dim:#E2D9C4;
    --yellow:#F5B400;
    --rust:#B5451B;
    --ink:#26221D;
    --steel:#5C7A8A;
    --line:#C9BEA4;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--charcoal);
    font-family:'IBM Plex Sans', sans-serif;
    color:var(--paper);
  }

  header{
    padding:28px 24px 20px;
    border-bottom:3px solid var(--yellow);
    background:
      repeating-linear-gradient(135deg, rgba(0,0,0,0.15) 0 10px, transparent 10px 20px),
      var(--charcoal);
  }

  header .brand{
    display:flex;
    align-items:baseline;
    gap:12px;
    max-width:900px;
    margin:0 auto;
  }

  header h1{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    letter-spacing:1px;
    font-size:clamp(28px, 4vw, 40px);
    margin:0;
    text-transform:uppercase;
  }

  header .tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:var(--yellow);
    background:rgba(0,0,0,0.3);
    padding:3px 8px;
    border-radius:2px;
  }

  header p.sub{
    max-width:900px;
    margin:8px auto 0;
    font-size:14px;
    color:var(--line);
  }

  main{
    max-width:900px;
    margin:36px auto 60px;
    padding:0 20px;
  }

  /* --- the docket / search panel --- */
  .docket{
    background:var(--paper);
    color:var(--ink);
    border-radius:4px;
    position:relative;
    box-shadow:0 20px 40px rgba(0,0,0,0.35);
    padding:28px 28px 24px;
  }

  .docket::before{
    content:"";
    position:absolute;
    top:0; left:24px; right:24px;
    height:0;
    border-top:2px dashed var(--rust);
    opacity:0.35;
  }

  .docket-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
    padding-bottom:12px;
    border-bottom:1px dashed var(--line);
  }

  .docket-head h2{
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    font-size:18px;
    letter-spacing:1px;
    margin:0;
  }

  .docket-head span{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--rust);
  }

  .fields{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));
    gap:14px;
    margin-bottom:18px;
  }

  .field label{
    display:block;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.6px;
    color:var(--rust);
    margin-bottom:5px;
    font-weight:600;
  }

  .field input{
    width:100%;
    padding:10px 10px;
    border:1px solid var(--line);
    background:#fff;
    border-radius:2px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
    color:var(--ink);
  }

  .field input:focus{
    outline:2px solid var(--steel);
    outline-offset:1px;
  }

  button.search-btn{
    background:var(--yellow);
    color:var(--ink);
    border:none;
    font-family:'Oswald', sans-serif;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:1px;
    font-size:15px;
    padding:12px 26px;
    border-radius:2px;
    cursor:pointer;
    transition:transform 0.1s ease;
  }
  button.search-btn:hover{ transform:translateY(-1px); }
  button.search-btn:active{ transform:translateY(0); }
  button.search-btn:focus-visible{ outline:3px solid var(--steel); outline-offset:2px; }

  .status{
    margin-top:34px;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:var(--line);
  }

  /* --- results as torn ticket stubs --- */
  #results{
    margin-top:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .ticket{
    background:var(--paper-dim);
    color:var(--ink);
    border-radius:3px;
    padding:14px 16px;
    display:grid;
    grid-template-columns:auto 1fr auto;
    gap:14px;
    align-items:center;
    position:relative;
    border-left:4px solid var(--rust);
  }

  .ticket img{
    width:56px;
    height:56px;
    object-fit:cover;
    border-radius:2px;
    background:#ccc;
  }

  .ticket .info a{
    color:var(--ink);
    text-decoration:none;
    font-weight:600;
    font-size:14px;
    line-height:1.3;
  }
  .ticket .info a:hover{ text-decoration:underline; }

  .ticket .meta{
    font-size:11px;
    color:var(--steel);
    margin-top:4px;
    font-family:'IBM Plex Mono', monospace;
  }

  .ticket .price{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:16px;
    color:var(--rust);
    white-space:nowrap;
    text-align:right;
  }

  .ticket .price .source-badge{
    display:block;
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    color:var(--steel);
    margin-top:4px;
  }

  .sources-line{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--line);
    margin-top:10px;
  }

  .empty, .error{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    padding:16px;
    border-radius:3px;
    margin-top:20px;
  }
  .empty{ background:var(--panel); color:var(--line); }
  .error{ background:#3a1c14; color:#f0b39a; border:1px solid var(--rust); }

  footer{
    text-align:center;
    font-size:12px;
    color:var(--steel);
    padding:20px;
  }

  @media (prefers-reduced-motion: reduce){
    button.search-btn{ transition:none; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>ApexRML</h1>
    <span class="tag">GLASGOW</span>
  </div>
  <p class="sub">Live part search across eBay's UK marketplace — enter what you're after below.</p>
</header>

<main>
  <div class="docket">
    <div class="docket-head">
      <h2>Job Docket · Part Search</h2>
      <span id="docket-no">NO. 0001</span>
    </div>

    <form id="search-form" onsubmit="return false;">
      <div class="fields">
        <div class="field">
          <label for="make">Make</label>
          <input id="make" placeholder="e.g. Ford" autocomplete="off" />
        </div>
        <div class="field">
          <label for="model">Model</label>
          <input id="model" placeholder="e.g. Focus" autocomplete="off" />
        </div>
        <div class="field">
          <label for="year">Year</label>
          <input id="year" placeholder="e.g. 2015" autocomplete="off" />
        </div>
        <div class="field">
          <label for="part">Part</label>
          <input id="part" placeholder="e.g. brake pads" autocomplete="off" />
        </div>
      </div>
      <button class="search-btn" id="search-btn" type="submit">Search Parts</button>
    </form>

    <div class="status" id="status"></div>
    <div class="sources-line">Searching: {{ sources | join(", ") }}</div>
  </div>

  <div id="results"></div>
</main>

<footer>ApexRML — results pulled live from eBay UK. Prices and stock change constantly, always confirm before ordering.</footer>

<script>
  const form = document.getElementById("search-form");
  const btn = document.getElementById("search-btn");
  const statusEl = document.getElementById("status");
  const resultsEl = document.getElementById("results");
  const docketNo = document.getElementById("docket-no");
  let ticketCount = 0;

  function randomDocketNo(){
    return "NO. " + String(Math.floor(1000 + Math.random() * 8999));
  }

  async function runSearch(){
    const make = document.getElementById("make").value.trim();
    const model = document.getElementById("model").value.trim();
    const year = document.getElementById("year").value.trim();
    const part = document.getElementById("part").value.trim();

    if(!make && !model && !year && !part){
      statusEl.textContent = "Enter at least one field to search.";
      return;
    }

    docketNo.textContent = randomDocketNo();
    btn.disabled = true;
    btn.textContent = "Searching...";
    statusEl.textContent = "Checking eBay UK for matching parts...";
    resultsEl.innerHTML = "";

    const params = new URLSearchParams({ make, model, year, part });

    try {
      const res = await fetch(`/search?${params.toString()}`);
      const data = await res.json();

      if(!res.ok){
        statusEl.textContent = "";
        resultsEl.innerHTML = `<div class="error">${data.error || "Something went wrong."}</div>`;
        return;
      }

      let statusText = `${data.results.length} result(s) for "${data.query}"`;
      if(data.warnings && data.warnings.length){
        statusText += ` — note: ${data.warnings.join(" | ")}`;
      }
      statusEl.textContent = statusText;

      if(!data.results.length){
        resultsEl.innerHTML = `<div class="empty">No matching parts found. Try fewer or different words.</div>`;
        return;
      }

      resultsEl.innerHTML = data.results.map(item => `
        <div class="ticket">
          ${item.image ? `<img src="${item.image}" alt="" loading="lazy">` : `<div style="width:56px;height:56px;background:#ccc;border-radius:2px;"></div>`}
          <div class="info">
            <a href="${item.link}" target="_blank" rel="noopener noreferrer">${item.title}</a>
            <div class="meta">${item.condition || "Condition n/a"} · seller: ${item.seller || "n/a"}</div>
          </div>
          <div class="price">${item.price || "—"}<span class="source-badge">${item.source || ""}</span></div>
        </div>
      `).join("");

    } catch(err){
      statusEl.textContent = "";
      resultsEl.innerHTML = `<div class="error">Couldn't reach the server. Check your connection and try again.</div>`;
    } finally {
      btn.disabled = false;
      btn.textContent = "Search Parts";
    }
  }

  form.addEventListener("submit", runSearch);
</script>

</body>
</html>
